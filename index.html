<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个性展示页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", Arial, sans-serif;
        }
        body {
            background: linear-gradient(to bottom right, #f0f9ff, #e6f7ff);
            min-height: 100vh;
            padding: 40px 0;
        }

        .container {
            width: 70%;
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        .title {
            color: #2c3e50;
            font-size: 32px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .title::after {
            content: "";
            display: block;
            width: 80px;
            height: 3px;
            background-color: #2196f3;
            margin: 10px auto 0;
        }

        .content {
            margin: 30px 0;
        }
        .content p {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">我的个性展示页</h1>
        <div class="content">
            <p>这是一个用HTML+CSS装饰的简单页面~ 可以在这里展示你的个人介绍、兴趣爱好，或者任何你想分享的内容。</p>
            <p>通过调整CSS的颜色、布局和动画，可以做出更有个性的效果哦！</p>
        </div>
        <a href="#" class="btn">点击查看更多</a>
    </div>
</body>
</html>
