<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body><div class="container">
        <div class="header">
            <h1>注册</h1>

         <div class="divider"></div>
        
        <div class="form-section">
            <h2>注册</h2>
            
            <form id="registrationForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入用户名">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="  ">
                </div>
                
                <div class="form-group">
                    <label>性别</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="gender" value="male"> 男
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="female"> 女
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>爱好</label>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="hobby" value="reading"> 读书
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="hobby" value="sports"> 体育
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="hobby" value="travel"> 旅游
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="hobby" value="games"> 游戏
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="hobby" value="music"> 音乐
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>出生日期</label>
                    <div class="date-group">
                      <input type="password" id="confirmPassword" class="form-control" placeholder="/年/月/日">  
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">邮箱</label>
                <div class="date-group">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="XXX.com">
                </div>
                </div>
                
                <div class="form-group">
                    <label for="phone">联系电话</label>
                <div class="date-group"><input type="password" id="confirmPassword" class="form-control" placeholder=" ">
                </div>
                </div>
                
                <div class="form-group">
                    <label for="nationality">国籍</label>
                    <select id="nationality" class="form-control">
                        <option value="china" selected>中国</option>
                        <option value="usa">外国</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="username">个人简介</label>
                    <input type="text" id="username">
            
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <button type="reset" class="btn btn-reset">重置</button>
                    <button type="button" class="btn btn-normal">普通按钮</button>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
