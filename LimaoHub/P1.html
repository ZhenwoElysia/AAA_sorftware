<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<title>练习1</title>
	</head>
	<body>
        <hr>
			<h2 style="text-align: center;">注册</h2>
            
        <table  align="center" cellpadding="5" cellspacing="1">
            <tr>
                <td>用户名</td>
                <td><input placeholder="--请输入用户名--"></td>
            </tr>
            <tr>
                <td>密码</td>
                <td><input placeholder="--请输入密码--" type="password"></td>
            </tr>
            <tr>
                <td>确认密码</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>性别</td>
                <td>
                    <input type="radio" name="gender" value="male">男
                    <input type="radio" name="gender" value="female">女
                </td>
            </tr>
            <tr>
                <td>爱好</td>
                <td>
                    <input type="checkbox" name="hobby" value="reading">读书
                    <input type="checkbox" name="hobby" value="sports">体育
                    <input type="checkbox" name="hobby" value="travel">旅游
                    <input type="checkbox" name="hobby" value="game">游戏
                    <input type="checkbox" name="hobby" value="music">音乐
                </td>
            </tr>
            <tr>
                <td>出生日期</td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td>邮箱</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>联系电话</td>
                <td><input type="tel"></td>
            </tr>
            <tr>
                <td>国籍</td>
                <td>
                    <select>
                        <option>中国</option>
                        <option>美国</option>
                        <option>英国</option>
                        <option>法国</option>
                        <option>德国</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>个人简介</td>
                <td><textarea rows="4" cols="30" placeholder="请输入个人简介"></textarea></td>
            </tr>
        </table>
        </div>
            <div style="text-align: center;">
                <input type="submit" value="提交">
                <input type="reset" value="重置">
                <button>普通按钮</button>
                <br>
            </div>
            <div>
            <h1>图书列表</h1>
            <ol>
                <li><img id="book1" src="05.jpeg" alt="图片加载失败" width="64" height="96"></li>
                <p><a href="#book1">电工学</a></p>
                
                <li><img id="book2" src="06.jpeg" alt="图片加载失败" width="64" height="96"></li>
                <p><a href="#book2">中国文化简史</a></p>
                
                <li><img id="book3" src="07.jpg" alt="图片加载失败" width="64" height="96"></li>
                <p><a href="#book3">资治通鉴</a></p>
                
            </ol>
            </div>
	</body>
</html>
